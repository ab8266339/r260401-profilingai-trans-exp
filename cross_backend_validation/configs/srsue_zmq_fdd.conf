# srsUE-compatible FDD protocol smoke. No SDR or over-the-air RF.
[rf]
device_name = zmq
device_args = tx_port=tcp://*:2001,rx_port=tcp://localhost:2000,id=ue,base_srate=23.04e6
tx_gain = 0
rx_gain = 0
srate = 23.04e6

[rat.eutra]
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
max_nof_prb = 106
nof_prb = 106
scs = 15
ssb_scs = 15
dl_nr_arfcn = 368500
ssb_nr_arfcn = 368410

[usim]
mode = soft
algo = milenage
opc = E8ED289DEBA952E4283B54E88E6183CA
k = 465B5CE8B199B49FAA5F0A2EE238A6BC
imsi = 999700000000001
imei = 437081612581615

[nas]
apn = internet
apn_protocol = ipv4

[slicing]
enable = false
nssai-sst = 1

[gw]
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[pcap]
enable = none

[log]
filename = stdout
all_level = info
all_hex_limit = 32

[gui]
enable = false
